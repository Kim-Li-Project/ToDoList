<main class="min-h-screen bg-slate-100 px-4 py-10">
  <section class="mx-auto max-w-2xl">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900">
        TODO List Application
      </h1>
    </header>
    <app-add-todo
      (todoCreated)="onTodoCreated($event)"
    />
    @if (error()) {
      <div
        class="mb-4 rounded-lg bg-red-100 p-4 text-sm text-red-700"
      >
        {{ error() }}
      </div>
    }

    @if (loading()) {
      <p class="text-slate-500">Loading TODO items...</p>
    } @else {
      <app-todo-list [todos]="todos()" (deleteRequested)="onDeleteRequest($event)"/>
    }
  </section>
</main>
